<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 42" width="165" height="42" role="img" aria-label="Receipts Express">
  <defs>
    <filter id="logo-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#logo-shadow)">
    <!-- Left: Receipt Icon + Express Motion Accent -->
    <g transform="translate(2, 3)">
      <!-- Receipt outline -->
      <path
        d="M 5,2 H 27 C 28.1,2 29,2.9 29,4 V 32 L 25.5,29.5 L 22,32 L 18.5,29.5 L 15,32 L 11.5,29.5 L 8,32 V 4 C 8,2.9 8.9,2 10,2 Z"
        fill="rgba(255, 255, 255, 0.12)"
        stroke="#ffffff"
        stroke-width="2.2"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
      <!-- Receipt detail lines -->
      <line x1="12" y1="9" x2="23" y2="9" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <line x1="12" y1="14" x2="19" y2="14" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <line x1="12" y1="19" x2="17" y2="19" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <line x1="12" y1="24" x2="22" y2="24" stroke="#ffedd5" stroke-width="1.8" stroke-linecap="round" />

      <!-- Express speed arrow badge overlay -->
      <path
        d="M 23,17 L 34,22 L 23,27 L 26,22 Z"
        fill="#ffedd5"
        stroke="#ffffff"
        stroke-width="0.5"
      />
      <line x1="19" y1="19" x2="22" y2="19" stroke="#ffedd5" stroke-width="1.5" stroke-linecap="round" />
      <line x1="19" y1="25" x2="22" y2="25" stroke="#ffedd5" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Right: Stacked Title Text ("Receipts" then "EXPRESS" underneath) -->
    <text
      x="44"
      y="19"
      fill="#ffffff"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="19"
      font-weight="800"
      letter-spacing="0.5px"
    >Receipts</text>

    <text
      x="45"
      y="35"
      fill="#ffedd5"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="12"
      font-weight="800"
      letter-spacing="3.5px"
    >EXPRESS</text>
  </g>
</svg>
