name: Build, test, and deploy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Once a day, with nothing pushed. A new advisory against a dependency
  # already on main changes no file here, so without this `npm audit` only
  # ran when someone happened to push, and a high-severity advisory sat on
  # the live site's lockfile for eleven weeks. Only `test` runs: `build` and
  # `deploy` are limited to push and workflow_dispatch by their own `if`.
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      # The scheduled run gets a group of its own. It runs on main, so in the
      # shared group it would cancel the test of a push to main that happened
      # to be in flight, and `build` and `deploy` for that push would never run.
      group: test-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
      cancel-in-progress: true
    steps:
      # No authenticated git operations happen after checkout, so the token never needs to persist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high

  build:
    needs: test
    permissions:
      contents: read
      pages: write
    # Only the main branch is ever deployed — a push to any other branch
    # (including in-progress feature/agent branches) must not touch the
    # live site. workflow_dispatch stays available for an explicit manual
    # deploy, which always targets the ref chosen when it's run.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      # No authenticated git operations happen after checkout, so the token never needs to persist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Derived from the repo name so the base path stays correct if the
          # repository is renamed (GitHub Pages serves project sites at /<repo>/).
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1